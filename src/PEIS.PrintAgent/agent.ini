# ============================================================
# PEIS.WorkstationAgent 配置文件
# 修改后重启 Agent 服务生效
# ============================================================

# ==================== 服务器连接（必填）====================
# API 服务器地址（必填）
#   格式：http://服务器IP:端口
#   示例：http://192.168.0.88:82
#   注意：Agent 和 API 之间网络必须互通
ServerUrl=http://192.168.0.88:82

# ==================== 打印模式配置 ====================
# 静默打印开关
#   false = 弹出PDF预览窗口，首次打印时弹出打印机选择对话框
#          之后自动记住该报表(djid)上次选择的打印机
#   true  = 不显示PDF，直接用已记住的打印机打印
#          首次使用时：有 DefaultPrinter 就用它，没有就用 Windows 默认打印机
SilentPrint=false

# 默认打印机名称（可选）
#   留空 = 使用 Windows 系统默认打印机
#   填写 = 首次打印时自动选择此打印机（需 SilentPrint=true 才完全生效）
#   示例：DefaultPrinter=HP LaserJet Pro MFP M428fdw
DefaultPrinter=

# ==================== 打印后端配置 ====================
# 打印后端类型
#   DryRun    = 模拟打印（不真正打印，仅生成PDF文件，用于测试）
#   Shell     = 调用外部程序打印（真正静默打印时使用）
#   WinPDF    = 使用 Windows 内置 PDF 阅读器打印
PrintBackend=DryRun

# 外部打印程序路径（仅 PrintBackend=Shell 时需要）
#   示例：PrintExecutable=C:\Program Files\SumatraPDF\SumatraPDF.exe
PrintExecutable=

# 打印参数模板（仅 PrintBackend=Shell 时需要）
#   支持占位符：
#     {file}    = PDF文件路径
#     {printer} = 打印机名称
#     {copies}  = 打印份数
#     {duplex}  = 双面打印参数
#   示例：PrintArgumentsTemplate={file} -print-to {printer} -print-settings {copies}x
PrintArgumentsTemplate={file} {printer} {copies} {duplex}
