# ============================================================
# PEIS.PrintAgent 打印代理配置文件
# 修改后请双击 [关闭服务.cmd] 再 [启动服务.cmd] 使其生效
# ============================================================

# ==================== 服务器连接（必填）====================
# API 服务器地址（必填）
#   格式：http://服务器IP:端口
#   示例：http://192.168.0.237:82 或 http://192.168.0.88:82
ServerUrl=http://192.168.0.237:82

# 工作站标识（选填）
#   留空或填写 AUTO 则自动使用当前计算机名
#   填写示例：StationId=STATION-01
StationId=AUTO

# ==================== 打印模式配置 ====================
# 静默打印开关
#   false = 弹出PDF预览窗口，首次打印时弹出打印机选择对话框
#          之后自动记住该报表(djid)上次选择的打印机
#   true  = 不显示PDF预览，直接用已记住的打印机打印
#          首次使用时：优先使用 DefaultPrinter，没有则使用 Windows 默认打印机
SilentPrint=false

# 默认打印机名称（选填）
#   留空 = 使用 Windows 系统默认打印机
#   填写 = 首次打印时自动选择此打印机（需 SilentPrint=true 才完全生效）
#   示例：DefaultPrinter=HP LaserJet Pro MFP M428fdw
DefaultPrinter=

# ==================== 打印后端配置 ====================
# 打印后端类型
#   DryRun    = 模拟打印（不真正调用物理打印机，仅下载并验证PDF，用于测试调试）
#   Command   = 调用外部命令行程序进行静默打印
PrintBackend=DryRun

# 外部打印程序路径（仅 PrintBackend=Command 时需要）
#   示例：PrintExecutable=C:\Program Files\SumatraPDF\SumatraPDF.exe
PrintExecutable=

# 打印参数模板（仅 PrintBackend=Command 时需要）
#   支持占位符：
#     {file}    = PDF文件路径
#     {printer} = 打印机名称
#     {copies}  = 打印份数
#   示例：PrintArgumentsTemplate={file} -print-to {printer} -print-settings {copies}x
PrintArgumentsTemplate={file} -print-to {printer} -print-settings {copies}x
