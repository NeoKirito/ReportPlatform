# ==============================================================================
# PEIS.ReportApi 现场配置文件
# 修改配置后，请先关闭报表服务，再重新启动服务使配置生效。
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. 基础网络与数据库配置（必填）
# ------------------------------------------------------------------------------
# 服务监听端口（默认监听本机全部 IPv4 网卡的 82 端口）
Port=82

# 现有 SQL Server 报表数据库连接字符串（只在此文件保存，不得提交至公开仓库）
# 示例：Server=192.168.0.10;Database=TJXT3.0;User ID=report_user;Password="your-password";Encrypt=True;TrustServerCertificate=True;
# 密码包含分号时请用双引号包住密码；反斜杠、百分号无需转义
ConnectionString=Server=YOUR_SERVER;Database=YOUR_DB;User ID=YOUR_USER;Password="YOUR_PASSWORD";TrustServerCertificate=True;

# ==============================================================================
# 2. 水印自定义配置（现场可按需配置，满足开/关、动态取字段、条件隐藏等所有需求）
# ==============================================================================
# 【开关】水印总开关：true=开启，false=关闭（默认 false，若医院现场不需要水印请设为 false）
WatermarkEnabled=false

# 【字段提取】动态从当前报表数据中提取字段作为水印（重点解决不同报表字段不同的问题）：
#  - 支持配置多个候选字段名，以英文逗号分隔，例如：xm,hzxm,b_name,name,patient_name,dwmc
#  - 渲染时系统会自动按顺序在当前报表的数据集（Master 表等）中查找存在的列，取第一项非空值。
#    如：健康体检单有 xm 列则取 xm；职业体检单有 hzxm 列则取 hzxm；完全不用担心不同报表列名不一致！
#  - 若报表中未找到候选列，系统会自动安全回退到维护库 dbo.qx_hospital.jgmc 读取医院机构名称。
WatermarkField=xm,hzxm,b_name,name

# 【固定文字】固定水印内容（可选）：
#  - 若配置了此项，所有报表均统一显示该固定文字，不再读取动态字段。
#  - 示例：WatermarkText=仅供预览·不得用于正式证明
WatermarkText=

# 【组合模板】水印文字组装模板（可选）：
#  - 支持宏占位符：{Field} 表示提取到的字段值，{HospitalName} 表示维护库读取的医院机构名称。
#  - 示例：WatermarkTemplate={Field} 仅供核对
#  - 示例：WatermarkTemplate={Field} - {HospitalName}
#  - 若留空，则直接显示提取到的字段值或固定文字。
WatermarkTemplate=

# 【排除报表】强制不打水印的报表 ID 列表（以英文逗号分隔）：
#  - 项目条码单、体检指引单、财务单据等排版密集或用于扫码的单据，严禁打水印。
#  - 无论 WatermarkEnabled 是否开启，在排除列表中的报表均永不添加水印。
WatermarkExcludeReports=xmtm,tjdj

# 【条件隐藏】根据数据字段状态决定是否隐藏水印（可选）：
#  - 例如已审核报告不显示水印，未审核报告显示水印：
#    配置 WatermarkConditionField=sh_flag 且 WatermarkHideWhenValue=1
#    当数据中 sh_flag 字段的值为 1（已审核）时，系统自动隐藏水印。
WatermarkConditionField=
WatermarkHideWhenValue=

# 【视觉样式】水印显示效果微调（可选）：
#  - WatermarkOpacity: 水印透明度（推荐 0.08 ~ 0.20，默认 0.12，数值越小越淡，避免遮挡病历数据）
#  - WatermarkAngle: 旋转角度（负数代表对角线向上倾斜，正数代表向下倾斜，默认 -30）
#  - WatermarkFontSize: 字体大小（默认 54pt）
WatermarkOpacity=0.12
WatermarkAngle=-30
WatermarkFontSize=54

# 【专属覆盖】个别特殊报表专属字段配置（可选，格式：WatermarkField_报表ID=字段名）：
#  - 若某张极特殊的报表不想使用上述通用的 WatermarkField，可单独为其指定字段：
#  - 示例：WatermarkField_jktjbbd=xm
#  - 示例：WatermarkField_zytj=dwmc

# ==============================================================================
# 3. PDF 安全与防篡改配置（现场可按需开启）
# ==============================================================================
# 【开关】是否启用 PDF 权限保护（禁止编辑修改）：true=开启，false=关闭（默认 false）
#  - 开启后，受检者与医生正常查阅与打印不受任何影响（直接双击打开浏览）；
#  - 但使用 Adobe Acrobat Pro、福昕 PDF 编辑器、WPS 等工具时，将强制锁定“编辑文本与图像”、“页面增删”等功能，有效防止篡改体检指标。
PdfSecurityEnabled=false

# 【所有者密码】权限密码（可选）：
#  - 留空则系统自动随机生成强密码（32位高强度随机散列），普通人绝无法猜解；
#  - 若体检科有固定管理口令，也可在此指定。
PdfOwnerPassword=

# 【允许打印】是否允许打印报告（体检报告通常必须允许打印）：true=允许，false=禁止（默认 true）
PdfAllowPrint=true

# 【允许复制】是否允许复制文字与图像：true=允许，false=禁止（默认 false，防内容盗取）
PdfAllowCopy=false
